# Minimal Cloud Build config: `gcloud builds submit --tag` can't pass a
# custom Dockerfile path (`-f`) alongside `--tag`, so scripts/deploy_cloud_run.sh
# uses this config + a substitution instead.
steps:
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-f", "deploy/Dockerfile.pro", "-t", "${_IMAGE}",
           "--build-arg", "GIT_SHA=${_GIT_SHA}", "."]
images:
  - "${_IMAGE}"
substitutions:
  # baked into the image so the audit stamp cannot drift from the running
  # code the way the merged GIT_SHA env var did
  _GIT_SHA: "unknown"
